apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lab-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.3.246-192.168.3.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
